name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
            symfony: '^7.2'
          - php: '8.3'
            testbench: '^11.0'
            symfony: '^7.4'
          - php: '8.4'
            testbench: '^11.0'
            symfony: '^8.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }} / Symfony ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Select framework stack
        run: |
          composer require --dev orchestra/testbench:"${{ matrix.testbench }}" --no-update
          composer require symfony/http-foundation:"${{ matrix.symfony }}" --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-security-blocking

      - name: Validate package
        run: composer validate --strict

      - name: Run tests
        run: composer test
